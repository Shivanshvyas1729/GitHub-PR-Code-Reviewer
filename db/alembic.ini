;  https://alembic.sqlalchemy.org/en/latest/tutorial.html#tutorial-alembic-ini

# This file is alembic.ini, the central configuration file for Alembic,
;  which is a lightweight database migration tool for Python (typically used alongside SQLAlchemy).
; Its primary purpose is to track, manage, and apply changes to your database schema 
; (like creating tables, adding columns, or altering data types) over time as your application evolves.

; 1. Connecting to your Database
; 2. Locating Migration Files
; 3. Log Formatting and Troubleshooting

[alembic]
# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = migrations

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

sqlalchemy.url = postgresql+asyncpg://user:password@postgres:5432/codereviewer

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S